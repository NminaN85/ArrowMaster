<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Puzzle - Full Version</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #fff;
        }
        .game-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 380px;
            width: 90%;
        }
        .header {
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 24px;
            color: #818cf8;
            margin-bottom: 6px;
        }
        .header p {
            font-size: 13px;
            color: #94a3b8;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #e2e8f0;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 70px);
            grid-template-rows: repeat(4, 70px);
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        .cell {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }
        .cell:hover:not(.empty) {
            background: rgba(129, 140, 248, 0.2);
            transform: scale(1.05);
            border-color: #818cf8;
        }
        .cell.empty {
            background: transparent;
            border: 2px dashed rgba(255, 255, 255, 0.05);
            cursor: default;
        }
        /* حركة الاهتزاز عند الاصطدام أو وجود عائق */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
        .shake {
            animation: shake 0.3s ease-in-out;
            border-color: #ef4444 !important;
            background: rgba(239, 68, 68, 0.2) !important;
        }
        /* حركة الطيران للخارج */
        @keyframes flyOut {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }
        .fly {
            animation: flyOut 0.3s ease-out forwards;
        }
        .btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            width: 100%;
            transition: background 0.2s;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }
        .btn:hover {
            background: #4338ca;
        }
        .win-message {
            margin-top: 15px;
            font-size: 18px;
            color: #34d399;
            font-weight: bold;
            display: none;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <div class="header">
            <h1>Arrow Puzzle</h1>
            <p>فرّغ الأسهم التي طريقها سالك أولاً!</p>
        </div>
        
        <div class="stats">
            <div>المستوى: <span id="levelNum">1</span></div>
            <div>الأسهم المتبقية: <span id="remainingCount">16</span></div>
        </div>
        
        <!-- شبكة اللعبة 4x4 -->
        <div class="grid" id="gameGrid"></div>
        
        <div class="win-message" id="winMsg">🎉 ممتاز! تم اجتياز المستوى بنجاح!</div>
        
        <button class="btn" onclick="initGame()">إعادة اللعبة 🔄</button>
    </div>

    <script>
        const gridSize = 4; // شبكة 4 في 4
        let board = [];

        // اتجاهات الأسهم: الرمز والـ Delta (dx, dy)
        const arrowTypes = {
            '⬆️': { dx: 0, dy: -1 },
            '⬇️': { dx: 0, dy: 1 },
            '⬅️': { dx: -1, dy: 0 },
            '➡️': { dx: 1, dy: 0 }
        };

        const symbols = ['⬆️', '⬇️', '⬅️', '➡️'];

        function initGame() {
            // توليد شبكة عشوائية مبدئية
            board = [];
            for (let r = 0; r < gridSize; r++) {
                let row = [];
                for (let c = 0; c < gridSize; c++) {
                    const randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
                    row.push(randomSymbol);
                }
                board.push(row);
            }
            
            document.getElementById('winMsg').style.display = 'none';
            renderBoard();
        }

        const gridElement = document.getElementById('gameGrid');

        function renderBoard() {
            gridElement.innerHTML = '';
            let activeCount = 0;

            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const cellDiv = document.createElement('div');
                    cellDiv.classList.add('cell');
                    
                    const arrow = board[r][c];
                    if (arrow) {
                        cellDiv.innerHTML = arrow;
                        cellDiv.onclick = () => handleCellClick(r, c);
                        activeCount++;
                    } else {
                        cellDiv.classList.add('empty');
                    }
                    gridElement.appendChild(cellDiv);
                }
            }

            document.getElementById('remainingCount').innerText = activeCount;

            // لو خلصت كل الأسهم
            if (activeCount === 0) {
                document.getElementById('winMsg').style.display = 'block';
            }
        }

        function handleCellClick(r, c) {
            const arrow = board[r][c];
            if (!arrow) return;

            const { dx, dy } = arrowTypes[arrow];
            let currR = r + dy;
            let currC = c + dx;
            let isPathClear = true;

            // فحص المسار خطوة بخطوة لحد ما يخرج بره الشبكة
            while (currR >= 0 && currR < gridSize && currC >= 0 && currC < gridSize) {
                if (board[currR][currC] !== null) {
                    isPathClear = false;
                    break;
                }
                currR += dy;
                currC += dx;
            }

            const cellIndex = r * gridSize + c;
            const cellElement = gridElement.children[cellIndex];

            if (isPathClear) {
                // الطريق سالك: مسح السهم وتحريكه للخارج
                cellElement.classList.add('fly');
                setTimeout(() => {
                    board[r][c] = null;
                    renderBoard();
                }, 300);
            } else {
                // الطريق مسدود: اهتزاز السهم
                cellElement.classList.add('shake');
                setTimeout(() => {
                    cellElement.classList.remove('shake');
                }, 300);
            }
        }

        // بدء اللعبة لأول مرة
        initGame();
    </script>

</body>
</html>
