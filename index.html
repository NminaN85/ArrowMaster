<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Meowdoku - Cat Queens Puzzle</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        fredoka: ['Fredoka', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.25); }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop {
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .animate-shake {
            animation: shake 0.3s ease-in-out;
            border-color: #ef4444 !important;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 selection:bg-rose-500 selection:text-white">

    <!-- HEADER -->
    <header class="w-full max-w-md flex items-center justify-between py-2 border-b border-slate-800">
        <div class="flex items-center gap-2">
            <span class="text-3xl">🐱</span>
            <h1 class="text-2xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-rose-400 to-amber-400">
                MEOWDOKU
            </h1>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleSound()" id="sound-btn" class="w-10 h-10 rounded-full bg-slate-900 border border-slate-800 hover:bg-slate-800 flex items-center justify-center text-rose-400 transition">
                <i class="fa-solid fa-volume-high"></i>
            </button>
            <button onclick="resetBoard()" class="w-10 h-10 rounded-full bg-slate-900 border border-slate-800 hover:bg-slate-800 flex items-center justify-center text-amber-400 transition" title="إعادة المحاولة">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </header>

    <!-- MAIN GAME AREA -->
    <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center gap-3 my-auto py-2">

        <!-- STATS & LEVEL HEADER -->
        <div class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-3 flex items-center justify-between shadow-xl">
            <div>
                <span class="text-[11px] text-slate-400 font-bold block uppercase tracking-wider">المستوى الحالي</span>
                <span id="level-title" class="text-lg font-black text-amber-400">Level 1 (5x5)</span>
            </div>
            <div class="flex gap-1.5" id="cat-counter">
                <!-- أيقونات القلوب/القطط -->
            </div>
        </div>

        <!-- HINT TOAST -->
        <div class="w-full bg-rose-500/10 border border-rose-500/20 text-rose-300 rounded-xl px-3 py-2 text-xs text-center font-bold flex items-center justify-center gap-2">
            <span>💡 قطة واحدة لكل صف، عمود، ومنطقة لونية دون تلامس!</span>
        </div>

        <!-- PUZZLE GRID CONTAINER -->
        <div id="grid-container" class="relative w-full aspect-square max-w-[360px] bg-slate-900 p-2.5 rounded-2xl border border-slate-800 shadow-2xl grid gap-1.5">
            <!-- الخلايا يتم توليدها هنا -->
        </div>

        <!-- ACTION BUTTONS -->
        <div class="flex items-center justify-center gap-2 w-full">
            <button onclick="clearCrosses()" class="flex-1 py-3 px-3 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 font-bold text-xs hover:bg-slate-800 transition">
                مسح كل الـ ❌
            </button>
            <button onclick="resetBoard()" class="flex-1 py-3 px-3 rounded-xl bg-rose-500 text-slate-950 font-black text-xs shadow-lg shadow-rose-500/20 hover:bg-rose-600 transition">
                إعادة المستوى 🔄
            </button>
        </div>

    </main>

    <!-- WIN MODAL -->
    <div id="win-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-xs rounded-2xl p-6 text-center flex flex-col items-center gap-4 shadow-2xl animate-pop">
            <div class="w-20 h-20 rounded-full bg-rose-500/10 border-2 border-rose-500/30 text-rose-400 flex items-center justify-center text-4xl shadow-inner">
                🐱
            </div>
            <h2 class="text-2xl font-black text-amber-400">فوز رائع! 🎉</h2>
            <p class="text-xs text-slate-300 font-medium">لقد قمت بحل اللغز وتوزيع القطط بنجاح دون أي تعارض!</p>

            <button onclick="nextLevel()" class="w-full py-3.5 bg-gradient-to-r from-rose-500 to-amber-500 text-slate-950 font-black text-sm rounded-xl shadow-lg hover:opacity-90 transition active:scale-95">
                المستوى التالي ➡️
            </button>
        </div>
    </div>

    <!-- GAME LOGIC SCRIPT -->
    <script>
        /* ===================================================
           1. AUDIO ENGINE (FIXED FOR MOBILE / IOS SAFARI)
           =================================================== */
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'cross') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(500, now);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } else if (type === 'cat') {
                    // صوت مياو خفيف
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(550, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'win') {
                    // نغمة الفوز
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
                    osc.start(now);
                    osc.stop(now + 0.45);
                } else if (type === 'clear') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.04);
                    osc.start(now);
                    osc.stop(now + 0.04);
                }
            } catch (e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').innerHTML = soundEnabled 
                ? '<i class="fa-solid fa-volume-high"></i>' 
                : '<i class="fa-solid fa-volume-xmark text-slate-500"></i>';
        }

        /* ===================================================
           2. LEVEL DEFINITIONS & REGION COLORS
           =================================================== */
        const REGION_COLORS = [
            '#e11d48', // Red/Rose
            '#2563eb', // Blue
            '#059669', // Emerald
            '#d97706', // Amber
            '#7c3aed', // Violet
            '#0891b2', // Cyan
            '#db2777', // Pink
        ];

        const LEVELS = [
            // Level 1: 5x5 (Solvable Queens Puzzle)
            {
                size: 5,
                regions: [
                    [0, 0, 1, 1, 1],
                    [0, 2, 2, 1, 3],
                    [0, 2, 4, 3, 3],
                    [2, 2, 4, 4, 3],
                    [2, 4, 4, 3, 3]
                ]
            },
            // Level 2: 5x5
            {
                size: 5,
                regions: [
                    [0, 0, 0, 1, 1],
                    [0, 2, 0, 1, 3],
                    [2, 2, 1, 1, 3],
                    [2, 4, 4, 3, 3],
                    [4, 4, 4, 4, 3]
                ]
            },
            // Level 3: 6x6
            {
                size: 6,
                regions: [
                    [0, 0, 1, 1, 2, 2],
                    [0, 0, 1, 1, 2, 2],
                    [3, 3, 4, 4, 2, 5],
                    [3, 3, 4, 4, 5, 5],
                    [3, 4, 4, 5, 5, 5],
                    [3, 3, 5, 5, 5, 5]
                ]
            }
        ];

        let currentLevelIdx = 0;
        let gridState = []; // 0: empty, 1: ❌, 2: 🐱

        /* ===================================================
           3. BOARD RENDER & GAME LOGIC
           =================================================== */
        function initLevel(levelIdx) {
            currentLevelIdx = levelIdx;
            const level = LEVELS[currentLevelIdx];
            const size = level.size;

            gridState = Array(size).fill(0).map(() => Array(size).fill(0));

            document.getElementById('level-title').innerText = `Level ${currentLevelIdx + 1} (${size}x${size})`;
            document.getElementById('win-modal').classList.add('hidden');

            // Header Cat Counter
            const counterEl = document.getElementById('cat-counter');
            counterEl.innerHTML = '';
            for (let i = 0; i < size; i++) {
                counterEl.innerHTML += `<span id="cat-badge-${i}" class="text-xl opacity-25 transition-opacity">🐱</span>`;
            }

            // Grid Cells
            const container = document.getElementById('grid-container');
            container.style.gridTemplateColumns = `repeat(${size}, minmax(0, 1fr))`;
            container.style.gridTemplateRows = `repeat(${size}, minmax(0, 1fr))`;
            container.innerHTML = '';

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const regId = level.regions[r][c];
                    const color = REGION_COLORS[regId % REGION_COLORS.length];

                    const cell = document.createElement('div');
                    cell.id = `cell-${r}-${c}`;
                    cell.className = 'relative flex items-center justify-center rounded-xl cursor-pointer font-bold text-xl transition-all select-none border border-black/20 shadow-sm';
                    cell.style.backgroundColor = color;
                    cell.style.opacity = '0.9';

                    cell.onclick = () => handleCellTap(r, c);

                    container.appendChild(cell);
                }
            }
        }

        function handleCellTap(r, c) {
            initAudio(); // تفعيل الصوت فور الضغط
            const currentState = gridState[r][c];
            const nextState = (currentState + 1) % 3;

            gridState[r][c] = nextState;

            // إذا وضع القطة، نقوم بوضع ❌ تلقائياً في الصف والعمود والأجوار المستحيلة
            if (nextState === 2) {
                autoFillCrosses(r, c);
            }

            renderGridUI();

            if (nextState === 1) playSound('cross');
            else if (nextState === 2) playSound('cat');
            else playSound('clear');

            validateAndCheckWin();
        }

        // دالة وضع الـ ❌ تلقائياً عند وضع القطة لتسهيل وتنسيق اللعبة
        function autoFillCrosses(r, c) {
            const level = LEVELS[currentLevelIdx];
            const size = level.size;

            for (let i = 0; i < size; i++) {
                for (let j = 0; j < size; j++) {
                    if (i === r && j === c) continue;

                    const sameRow = (i === r);
                    const sameCol = (j === c);
                    const sameRegion = (level.regions[i][j] === level.regions[r][c]);
                    const isAdjacent = Math.abs(i - r) <= 1 && Math.abs(j - c) <= 1;

                    if ((sameRow || sameCol || sameRegion || isAdjacent) && gridState[i][j] === 0) {
                        gridState[i][j] = 1;
                    }
                }
            }
        }

        function renderGridUI() {
            const level = LEVELS[currentLevelIdx];
            const size = level.size;

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    const state = gridState[r][c];
                    cell.classList.remove('animate-shake');

                    if (state === 0) {
                        cell.innerHTML = '';
                    } else if (state === 1) {
                        cell.innerHTML = `<span class="text-slate-950/40 text-base font-black">❌</span>`;
                    } else if (state === 2) {
                        cell.innerHTML = `<span class="animate-pop text-2xl filter drop-shadow-md">🐱</span>`;
                    }
                }
            }
        }

        function validateAndCheckWin() {
            const level = LEVELS[currentLevelIdx];
            const size = level.size;

            let catLocations = [];

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    if (gridState[r][c] === 2) {
                        catLocations.push({ r, c, region: level.regions[r][c] });
                    }
                }
            }

            // تحديث عداد القطط العلوي
            for (let i = 0; i < size; i++) {
                const badge = document.getElementById(`cat-badge-${i}`);
                if (i < catLocations.length) badge.classList.remove('opacity-25');
                else badge.classList.add('opacity-25');
            }

            // فحص التعارضات
            let invalidCells = new Set();
            let hasConflict = false;

            for (let i = 0; i < catLocations.length; i++) {
                for (let j = i + 1; j < catLocations.length; j++) {
                    const c1 = catLocations[i];
                    const c2 = catLocations[j];

                    const sameRow = c1.r === c2.r;
                    const sameCol = c1.c === c2.c;
                    const sameRegion = c1.region === c2.region;
                    const isAdjacent = Math.abs(c1.r - c2.r) <= 1 && Math.abs(c1.c - c2.c) <= 1; // يشمل الأقطار

                    if (sameRow || sameCol || sameRegion || isAdjacent) {
                        hasConflict = true;
                        invalidCells.add(`${c1.r}-${c1.c}`);
                        invalidCells.add(`${c2.r}-${c2.c}`);
                    }
                }
            }

            // الاهتزاز عند وجود تعارض
            invalidCells.forEach(key => {
                const el = document.getElementById(`cell-${key}`);
                if (el) el.classList.add('animate-shake');
            });

            // شرط الفوز الصريح
            if (catLocations.length === size && !hasConflict) {
                playSound('win');
                setTimeout(() => {
                    document.getElementById('win-modal').classList.remove('hidden');
                }, 250);
            }
        }

        function clearCrosses() {
            const level = LEVELS[currentLevelIdx];
            for (let r = 0; r < level.size; r++) {
                for (let c = 0; c < level.size; c++) {
                    if (gridState[r][c] === 1) gridState[r][c] = 0;
                }
            }
            playSound('clear');
            renderGridUI();
            validateAndCheckWin();
        }

        function resetBoard() {
            initLevel(currentLevelIdx);
        }

        function nextLevel() {
            const nextIdx = (currentLevelIdx + 1) % LEVELS.length;
            initLevel(nextIdx);
        }

        window.onload = () => initLevel(0);
    </script>
</body>
</html>
